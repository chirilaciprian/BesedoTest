<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Besedo Records Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/modal.css">
</head>

<body>
    <div class="page">
        <header class="page-header">
            <div class="header-content">
                <div class="header-actions">
                    <button id="add-record" class="btn btn-primary" type="button">
                        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
                            <path
                                d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z" />
                        </svg>
                        <span>Add Record</span>
                    </button>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 20 20" width="18" height="18" fill="none"
                        stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="8.5" cy="8.5" r="5.5" />
                        <path d="m13 13 4 4" stroke-linecap="round" />
                    </svg>
                    <input type="search" id="records-search" class="search-input" placeholder="Search by any field..."
                        aria-label="Search records" autocomplete="off" />
                </div>
            </div>
        </header>

        <main class="table-container">
            <div class="table-wrapper">
                <table class="records-table" id="records-table">
                    <thead id="records-table-header"></thead>
                    <tbody id="records-table-body"></tbody>
                </table>
            </div>
        </main>

        <div id="modal"></div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
